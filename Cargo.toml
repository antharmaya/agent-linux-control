[workspace]
members = [
  "crates/alc",
  "crates/alc-core",
  "crates/alc-daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/antharmaya/agent-linux-control"

[workspace.dependencies]
alc-core = { path = "crates/alc-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
